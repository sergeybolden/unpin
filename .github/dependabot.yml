# Monthly update proposals for the pinned actions and the npm packages.
# An npm update to a library in vendor/ also needs `npm run vendor` before it reaches the site:
# the pull request changes only package.json and the lock file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A new release must be two weeks old before it is proposed.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
