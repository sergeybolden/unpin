# Publish the site to GitHub Pages.
# Runs on every push to main and every 6 hours, so the star count on the page stays fresh.
# The count is written into stars.json next to the page: visitors never contact GitHub's API.
name: Tests and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Nothing by default; each job gets only what it needs. The test job installs npm packages,
# so it may only read: a bad package there can't publish the site.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved); the comment says which release.
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No install scripts: the tests need the packages' files, not anything they would run.
      - run: npm ci --ignore-scripts
      - run: npm test
      # The browser for the end-to-end test, installed on purpose rather than by a package script.
      # Only Chromium's headless shell, the build Playwright runs headless.
      - name: Install Chromium for the end-to-end test
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .stargazers_count || echo "")
          if [ -n "$stars" ]; then echo "{\"stars\": $stars}" > stars.json; fi

      # Only the site itself: the pages at the top level and what they load.
      # No tests, scripts, packages or repository docs.
      - name: Collect the site files
        run: |
          mkdir _site
          cp *.html _site/
          cp -r manifest.webmanifest sw.js css js assets vendor _site/
          [ -f stars.json ] && cp stars.json _site/ || true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # GitHub turns off the schedule of a public repository after 60 days without activity in it,
  # and the star count would stop updating without a word. Enabling the workflow through the API
  # resets that count, so each scheduled run keeps the schedule alive: no commits to main, no
  # token beyond this run's own. The job checks out nothing and installs nothing;
  # actions: write is the narrowest permission the endpoint accepts.
  # Limit: this only works while the schedule runs. If it was already turned off (or a run fails
  # for weeks), turn it back on by hand under Actions → Tests and deploy → Enable workflow.
  keep-schedule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable"
